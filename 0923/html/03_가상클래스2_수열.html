<html lang="en">

        <title>Document</title>
        <style>
            h1:nth-of-type(3) {
                color: red;
            }
            h1:first-of-type {

            }

            div {
                width: 100px;
                height: 100px;
                background-color: aqua;

                text-align: center;
                line-height: 100px;

                border-radius: 50px;
                border-radius: 10px 20px 50px 20px;
            }
        </style>
    </head>
    <body>
        <h1>11111</h1>
        <h2>22222</h2>
        <h3>33333</h3>
        <h1>111111</h1>
