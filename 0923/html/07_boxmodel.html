<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                text-align: center;
                line-height: 100px;
                font-weight: bold;
            }
            div:nth-child(1) {
                background-color: red;
            }

            div:nth-child(2) {
                background-color: orange;
                margin: 20px;

                /*margin-top: 20px;
                    margin-left: 20Px;
                    margin-bottom: 20px;
                    margin-right: 20px;*/
            }

            div:nth-child(3) {
                background-color: green;
                padding: 20px;
            }
            div:nth-child(4) {
                border: 10px solid #000;
                background-color: blue;
            }
            div:nth-child(5) {
                background-color: rgb(116, 18, 18);
                margin: 20px;
                padding: 20px;
                border: 10px solid #000;
            }
            /* total width = cotent의 width값 + (margin + padding + border) x2 */
            #big {
                width: 140px;
                height: 140px;
                background-color: aqua;
                padding: 30px;
            }
            #small {
                width: 100px;
                height: 100px;
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <div>box1</div>
        <div>box2</div>
        <div>box3</div>
        <div>box4</div>
        <div>box5</div>

        <section id="big">
            <section id="small">BOX</section>
        </section>
    </body>
</html>
