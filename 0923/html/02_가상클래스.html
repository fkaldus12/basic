<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            h3:hover {
                color: aqua;
            }
            li {
                list-style: none;
                font-size: 30px;
                font-weight: bold;
            }

            li:first-child {
                color: blue;
            }
            li:nth-child(2) {
                color: rgb(212, 33, 78);
            }
            li:nth-child(3) {
                color: blue;
            }
            li:nth-child(4) {
                color: rgb(56, 230, 21);
            }
            li:nth-child(5) {
                color: rgb(0, 0, 0);
            }
            li:nth-child(6) {
                color: rgb(255, 0, 0);
            }
            li:nth-child(7) {
                color: blue;
            }
            li:nth-child(8) {
                color: rgb(24, 255, 55);
            }
            li:nth-child(9) {
                color: rgb(143, 143, 255);
            }
            li:last-child {
                color: rgb(255, 94, 0);
            }
        </style>
    </head>
    <body>
        <h2>가상클래스 (의사클래스)</h2>
        <h3>마우스 오버</h3>

        <ul>
            <li>001</li>
            <li>002</li>
            <li>003</li>
            <li>004</li>
            <li>005</li>
            <li>006</li>
            <li>007</li>
            <li>008</li>
            <li>009</li>
            <li>010</li>
            <li>011</li>
            <li>010</li>
            <li>010</li>
            <li>012</li>
        </ul>
    </body>
</html>
