<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            li {
                list-style: none;
            }
            #warp {
                width: 600px;
                height: 600px;
                background-color: gray;
                margin: 0 auto;

                padding: 30px;
            }

            li {
                width: 100px;
                height: 100px;
                float: left;
                margin: 10px;
            }
            li:nth-child(1) {
                background-color: red;
            }
            li:nth-child(2) {
                background-color: aqua;
            }
            li:nth-child(3) {
                background-color: green;
            }
            li:nth-child(4) {
                background-color: blue;
            }
            li:nth-child(5) {
                background-color: orange;
            }
        </style>
    </head>
    <body>
        <div id="warp">
            <ul>
                <li>menu1</li>
                <li>menu2</li>
                <li>menu3</li>
                <li>menu4</li>
                <li>menu5</li>
            </ul>
        </div>
    </body>
</html>
