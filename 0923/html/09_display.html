<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                background-color: red;
                border: 2px solid#000;
                display: inline;
            }
            span {
                display: block;
                width: 100px;
                height: 100px;
                background-color: aqua;
            }
            img {
                display: block;
            }

            /* block : 브라우저의 전체를 차지 div p h form ul li */
            /* inline : 그 요소의 공간만 차지 span img b i em strong input*/
        </style>
    </head>
    <body>
        <!-- 블록/인라인 -->
        <div>블록</div>
        <div>블록</div>
        <div>블록</div>
        <div>블록</div>
        <div>블록</div>

        <h1>dskdsdsdsds</h1>
        <p>sasasaa</p>

        <span>동해물과</span><span>백두산이마르</span><span>고닳도록</span>
        <img src="../img/cat.jpg" alt="" width="200" />
        <img src="../img/cat.jpg" alt="" width="200" />
        <img src="../img/cat.jpg" alt="" width="200" />
        <img src="../img/cat.jpg" alt="" width="200" />
        <img src="../img/cat.jpg" alt="" width="200" />
    </body>
</html>
