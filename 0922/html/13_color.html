<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            body {
                background-color: blueviolet;
            }
            p {
                color: red;
            }
            .color1 {
                background-color: blue;
            }
            .color2 {
                background-color: rgb(255 255 255);
            }
            .color3 {
                background-color: aqua;
            }
            .color4 {
                background-color: rgba(97, 255, 24, 0.4);
            }
            /* alpha : 0 ~ 1 */
            .color5 {
                color: #fff;
                background-color: #000;
                opacity: 0.3;
            }
            .color6 {
                background-color: #555665;
                color: #000;
            }
        </style>
    </head>
    <body>
        <h1>css color chart</h1>
        <p class="color1">color01</p>
        <p class="color2">color02</p>
        <p class="color3">color03</p>
        <p class="color4">color04</p>
        <p class="color5">color05</p>
        <p class="color6">color06</p>
        <p class="color7">color07</p>
        <p class="color8">color08</p>
        <p class="color9">color09</p>
        <p class="color10">color10</p>
        <!-- p.color$*10{color$$} -->
    </body>
</html>
