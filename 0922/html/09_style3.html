<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /* 선택자 {속성 : 속성값;} */
            h1 {
                color: red;
            }
            #blue {
                color: blue;
            }
            p {
                color: yellow;
            }
            .black {
                background-color: gray;
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>안녕하세여</h1>
        <h2>졸려용</h2>
        <h1 id="blue">열심히 공부합시당</h1>
        <p>빵 먹고싶어용</p>
        <p class="black">마라탕도 먹고싶어용</p>
        <p class="black">집에 가고싶어용</p>
        <p>야식 맛있게 드셨나요</p>
        <p>간식 맛있게 드셨나요</p>
    </body>
    <!--선택자 {속성 : 속성값; } 
    선택자의 종류
    1) 태그 - h1 {...}
    2) 아이디 _ #id {...}
    3) 클래스 - .class {...}

    아이디,클래스 이름 만들 때 규칙
    한글 x
    숫자+영문 x
    띄어쓰기 x
    특수문자 x
    첫글자 대문자 x
    의미없는 글자 (ex) aaa,ccc,vvvv...
    
    영문+숫자 0
    특수문자 중 : _- 
    
    -->
</html>
