<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- p태그는 단락태그입니다. 브라우저의
     한 줄 전체를 차지한다. -->
    <p>안녕하세여</p>
    <p>반갑습니다</p>
    <p>또 만나요</p>
    <!--주석 만들기-->
    <!-- ctrl = / -->
    <!-- 주석은 브라우저에 출력이 안 된다.
    편의에 따라서 필요하다 -->
    <p>모든 국민은 거주·이전의 자유를 가진다. <br>재산권의 행사는 공공복리에 적합하도록 하여야 한다. 대한민국은 민주공화국이다. 국군의 조직과 편성은 법률로 정한다.
    국회의원은 그 지위를 남용하여 국가·공공단체 또는 기업체와의 계약이나 그 처분에 의하여 재산상의 권리·이익 또는 직위를 취득하거나 타인을 위하여 그 취득을 알선할 수 없다.

</p>
<p>국회는 의장 1인과 부의장 2인을 선출한다. </p>
</body>
</html>
